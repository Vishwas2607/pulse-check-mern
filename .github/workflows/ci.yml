name: PulseCheck CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
           backend/package-lock.json
           backend/worker/package-lock.json

      - name: Cache MongoDB Binaries
        uses: actions/cache@v4
        with:
          path: /tmp/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run API tests
        working-directory: backend
        run: npm run test:api
        env:
          NODE_ENV: test
          JWT_SECRET: super_secret_test_key
          MONGOMS_DOWNLOAD_DIR: /tmp/mongodb-binaries


      - name: Install worker dependencies
        working-directory: backend/worker
        run: npm ci

      - name: Run Worker tests
        working-directory: backend/worker
        run: npm test 
        env:
          MONGOMS_DOWNLOAD_DIR: /tmp/mongodb-binaries

  
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build API Image
        uses: docker/build-push-action@v5
        with: 
          context: .
          file: backend/api/Dockerfile
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/pulsecheck-api:latest
      
      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/worker/Dockerfile
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/pulsecheck-worker:latest
      
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/pulsecheck-frontend:latest
